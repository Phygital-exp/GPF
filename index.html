<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutero GPF</title>
    <link rel="stylesheet" href="styles.css"> <!-- Vincula el archivo CSS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> <!-- Agrega Material Icons -->
    <link rel="icon" href="https://s3.amazonaws.com/botgen/Uploads/LogoGPFOf_1720642733.png" type="image/png"> <!-- Favicon -->
</head>
<body>
    <div class="search-container">
        <h1 id="searchTitle">Búsqueda datos GPF</h1>
        
        <select id="searchType" onchange="updatePlaceholder()">
            <option value="pdv">Buscar PDV</option>
            <option value="producto">Buscar Producto</option>
        </select>

        <input type="text" id="searchInput" placeholder="Ingresa el nombre PDV" oninput="handleInput()">

        <div id="results"></div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
</body>
</html>
